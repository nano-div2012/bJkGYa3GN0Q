<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RenzTools - Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

<style>
/* Reset & Base */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 30px 16px;
  background-color: #050505;
  background-image: 
    linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111),
    linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111);
  background-size: 40px 40px;
  background-position: 0 0, 20px 20px;
  background-blend-mode: overlay;
  color: #f8fafc;
  font-family: 'Inter', sans-serif;
  line-height: 1.5;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle at top center, rgba(15, 15, 15, 0.9) 0%, #050505 80%);
  z-index: -1;
}

.container {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  z-index: 1;
}

/* === 1. BANNER FOTO ATAS === */
.banner-container {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #333;
  background: #111;
  box-shadow: 0 10px 30px rgba(203, 213, 225, 0.05);
  margin-bottom: 8px;
}
.banner-container img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
}

.header {
  text-align: center;
  padding: 0 0 10px 0;
}
.header h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 24px;
  font-weight: 900;
  color: #fff;
  line-height: 1.2;
  font-style: italic;
  letter-spacing: -0.5px;
}
.header h1 span { color: #cbd5e1; }

/* === 2. LIST TIKTOK (SILVER THEME) === */
.link-section-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  font-weight: 800;
  color: #cbd5e1;
  margin-top: 10px;
  margin-bottom: 4px;
  padding-left: 10px;
  border-left: 3px solid #cbd5e1;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.link-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.link-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0f0f0f;
  border: 1px solid #222;
  padding: 16px 20px;
  text-decoration: none;
  color: #fff;
  transition: 0.3s;
  border-left: 3px solid #cbd5e1;
}
.link-card:hover {
  background: #1a1a1a;
  transform: translateX(5px);
  border-color: #cbd5e1;
  box-shadow: 0 5px 15px rgba(203, 213, 225, 0.1);
}
.link-card .text-box { display: flex; flex-direction: column; }
.link-card .title {
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 2px;
  color: #fff;
}
.link-card .desc {
  font-size: 12px;
  color: #94a3b8;
}
.link-card .icon-box {
  width: 36px; height: 36px;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #cbd5e1;
  transition: 0.3s;
}
.link-card:hover .icon-box {
  background: #cbd5e1;
  color: #050505;
  border-color: #cbd5e1;
}
.link-card .icon-box svg { width: 18px; height: 18px; fill: currentColor; }

/* === 3. LINK UTAMA BAWAH (CONFIG WEB) === */
.main-link-bottom {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(135deg, #e2e8f0, #94a3b8);
  border: 1px solid #cbd5e1;
  padding: 20px;
  text-decoration: none;
  color: #050505;
  transition: 0.3s;
  box-shadow: 0 10px 30px rgba(203, 213, 225, 0.15);
  margin-top: 10px;
}
.main-link-bottom:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(203, 213, 225, 0.3);
}
.main-link-bottom h2 {
  font-family: 'Montserrat', sans-serif;
  font-size: 18px;
  font-weight: 900;
  font-style: italic;
  text-transform: uppercase;
}
.main-link-bottom svg {
  width: 24px; height: 24px; fill: #050505;
}

/* === POPUP TIKTOK === */
.wa-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; opacity: 0; visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.wa-overlay.active { opacity: 1; visibility: visible; }
.wa-card {
  background: #0a0a0a; border: 1px solid #333;
  border-radius: 0px; width: 90%; max-width: 400px;
  padding: 24px; position: relative; transform: translateY(20px);
  transition: transform 0.3s ease;
  box-shadow: 0 25px 50px -12px rgba(239, 68, 68, 0.2); color: #fff;
  border-top: 4px solid #ef4444;
}
.wa-overlay.active .wa-card { transform: translateY(0); }
.wa-close {
  position: absolute; top: 16px; right: 16px;
  background: #1a1a1a; border: none; color: #a4a0bc;
  width: 28px; height: 28px; border-radius: 0px; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.wa-close:hover { background: #ef4444; color: #fff; }
.wa-header { margin-bottom: 16px; }
.wa-icon-box {
  width: 48px; height: 48px; background: #1a1a1a;
  border-radius: 0px; display: flex; align-items: center; justify-content: center;
  color: #ef4444; border: 1px solid #333;
}
.wa-icon-box svg { width: 24px; height: 24px; }
.wa-content h2 { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 6px; font-style: italic; }
.wa-content p { font-size: 13px; color: #a4a0bc; margin-bottom: 20px; }
.wa-content strong { color: #fff; font-weight: 600; }
.wa-link-card {
  display: flex; align-items: center; background: #111;
  border: 1px solid #333; border-radius: 0px; padding: 14px;
  text-decoration: none; color: #fff; margin-bottom: 20px; transition: 0.2s;
  border-left: 2px solid #ef4444;
}
.wa-link-card:hover { background: #1a1a1a; border-color: #ef4444; }
.wa-card-icon {
  width: 36px; height: 36px; background: #ef4444; color: #fff;
  border-radius: 0px; display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 16px; margin-right: 14px; flex-shrink: 0;
}
.wa-card-text { flex: 1; overflow: hidden; }
.wa-card-text h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; margin-bottom: 4px; }
.wa-card-text p { font-size: 11px; color: #8b85a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-arrow { font-size: 18px; color: #ef4444; margin-left: 10px; }
.wa-btn {
  width: 100%; padding: 15px; border: none; border-radius: 50px;
  background: linear-gradient(135deg, #ef4444, #f87171); color: #fff;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;
  font-style: italic;
}
.wa-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3); }
</style>
</head>

        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
